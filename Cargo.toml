[package]
name = "yubikey-watch"
version = "1.1.5"
edition = "2021"
description = "Lightweight cross-platform YubiKey tray monitor for Linux, macOS, and Windows"
license = "Apache-2.0"

[dependencies]
tray-icon = "0.21.2"
tao = "0.34.5"
image = "0.25.5"
hidapi = "2.6.3"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8.20"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"
glib-sys = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5.1"
