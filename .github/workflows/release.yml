name: release

on:
  push:
    branches:
      - linux
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  version-and-tag:
    name: bump version & create release tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: determine next semantic version
        id: bump
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "Latest tag: $LATEST_TAG"
          
          VER_NUM=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NUM"
          
          PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VER}"
          
          echo "Next version: $NEW_VER"
          echo "Next tag: $NEW_TAG"
          
          sed -i "s/^version = \".*\"/version = \"$NEW_VER\"/" Cargo.toml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Cargo.toml
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
          git tag "$NEW_TAG"
          git push origin linux --tags
          
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: build binary (${{ matrix.target }})
    needs: version-and-tag
    if: needs.version-and-tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            binary_name: yubi-tray-rs-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            binary_name: yubi-tray-rs-aarch64-linux
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-tag.outputs.new_tag }}

      - name: install system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev libudev-dev pkg-config

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross if required
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: prepare direct standalone binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yubikey-watch dist/${{ matrix.binary_name }}
          chmod +x dist/${{ matrix.binary_name }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.binary_name }}

  publish-release:
    name: publish github release
    needs:
      - version-and-tag
      - build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-tag.outputs.new_tag }}

      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: flatten binary artifacts
        run: |
          mkdir -p release_files
          find release-artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.new_tag }}
          name: Release ${{ needs.version-and-tag.outputs.new_tag }}
          draft: false
          prerelease: false
          files: release_files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
