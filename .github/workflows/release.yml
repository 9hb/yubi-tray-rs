name: release

on:
  push:
    branches:
      - linux
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  version-and-tag:
    name: bump version & create release tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: determine next semantic version
        id: bump
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.1.0"
          fi
          echo "Latest valid tag: $LATEST_TAG"
          
          VER_NUM=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER_NUM"
          
          PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VER}"
          
          echo "Next version: $NEW_VER"
          echo "Next tag: $NEW_TAG"
          
          sed -i -E 's/^version = "[^"]*"/version = "'"$NEW_VER"'"/' Cargo.toml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Cargo.toml
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]" || true
          git tag "$NEW_TAG"
          git push origin linux --tags
          
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-linux-macos:
    name: build (${{ matrix.target }})
    needs: version-and-tag
    if: needs.version-and-tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_arm_runner: false
            binary_name: yubi-tray-rs-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_arm_runner: true
            binary_name: yubi-tray-rs-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            use_arm_runner: false
            binary_name: yubi-tray-rs-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            use_arm_runner: false
            binary_name: yubi-tray-rs-macos-arm64
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-tag.outputs.new_tag }}

      - name: install system dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev libudev-dev pkg-config

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: prepare binary artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yubikey-watch dist/${{ matrix.binary_name }}
          chmod +x dist/${{ matrix.binary_name }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.binary_name }}

  build-windows:
    name: build (x86_64-pc-windows-msvc)
    needs: version-and-tag
    if: needs.version-and-tag.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: checkout windows branch
        uses: actions/checkout@v4
        with:
          ref: windows

      - name: setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: build release binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: prepare binary artifact
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/yubikey-watch.exe dist/yubi-tray-rs-windows.exe
        shell: pwsh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-pc-windows-msvc
          path: dist/yubi-tray-rs-windows.exe

  publish-release:
    name: publish unified release
    needs:
      - version-and-tag
      - build-linux-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-tag.outputs.new_tag }}

      - name: download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: flatten binary artifacts
        run: |
          mkdir -p release_files
          find release-artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.new_tag }}
          name: ${{ needs.version-and-tag.outputs.new_tag }}
          draft: false
          prerelease: false
          files: release_files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
